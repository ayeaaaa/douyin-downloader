<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <title>视频下载站</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="hero-text">
        <div class="brand">
          <svg class="brand-logo" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="视频下载站标识">
            <rect width="48" height="48" rx="12" fill="#2563eb"/>
            <path d="M24 12v14" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M17.5 20.5 24 27l6.5-6.5" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M15 29v3.5A3.5 3.5 0 0 0 18.5 36h11a3.5 3.5 0 0 0 3.5-3.5V29" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M31 8 37 11.5 31 15z" fill="#bfdbfe"/>
          </svg>
          <h1>视频下载站</h1>
        </div>
        <p class="sub">粘贴抖音链接或分享文案，一键保存到本地</p>
      </div>
      <svg class="hero-art" viewBox="0 0 240 180" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="120" cy="92" r="78" fill="#eff6ff"/>
        <rect x="78" y="26" width="84" height="106" rx="14" fill="#ffffff" stroke="#dbeafe" stroke-width="3"/>
        <rect x="88" y="38" width="64" height="56" rx="8" fill="#dbeafe"/>
        <path d="M113 58l16 8-16 8z" fill="#2563eb"/>
        <rect x="88" y="102" width="40" height="6" rx="3" fill="#e2e8f0"/>
        <rect x="88" y="114" width="26" height="6" rx="3" fill="#eef2f7"/>
        <path d="M120 128v14" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
        <path d="M112 136l8 8 8-8" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M98 158h44" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
        <rect x="30" y="40" width="26" height="22" rx="5" fill="#dbeafe"/>
        <circle cx="38" cy="48" r="3" fill="#93c5fd"/>
        <path d="M33 60l8-8 6 5 5-4 2 7z" fill="#93c5fd"/>
        <circle cx="42" cy="130" r="6" fill="#93c5fd"/>
        <path d="M48 130v-24l10 3" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="204" cy="52" r="7" fill="#93c5fd"/>
        <circle cx="196" cy="126" r="5" fill="#cbd5e1"/>
      </svg>
    </header>
    <section class="panel">
      <textarea id="input" rows="4" placeholder="粘贴链接或整段分享文案，可一次粘贴多条"></textarea>
      <div class="actions">
        <button id="parse-btn" class="primary">解析</button>
        <span id="status" class="status"></span>
      </div>
    </section>
    <section id="results" class="results"></section>
    <details class="panel cookie-panel">
      <summary>Cookie 设置</summary>
      <div class="cookie-body">
        <p id="cookie-status" class="status"></p>
        <textarea id="cookie-input" rows="5" placeholder="粘贴 Netscape 格式的 cookies.txt 内容"></textarea>
        <div class="actions">
          <input type="file" id="cookie-file" accept=".txt" hidden>
          <button id="cookie-pick">选择文件</button>
          <button id="cookie-save" class="primary">保存</button>
          <button id="cookie-clear">清除(恢复自动)</button>
          <span id="cookie-msg" class="status"></span>
        </div>
        <p class="hint">Cookie 仅保存在服务器 data/cookies.txt（权限 600），页面不会回显内容。公网部署请设置 ACCESS_PASSWORD。</p>
      </div>
    </details>
  </main>
  <div id="preview-overlay" class="preview-overlay hidden">
    <div class="preview-box">
      <div id="preview-content" class="preview-content"></div>
      <div class="preview-actions">
        <a id="preview-download" class="button-like" download>下载</a>
        <button id="preview-close">关闭</button>
      </div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
