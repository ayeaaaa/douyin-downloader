services:
  douyin-dl:
    build: .
    container_name: douyin-dl
    ports:
      - "${PORT:-8000}:8000"
    environment:
      ACCESS_PASSWORD: "${ACCESS_PASSWORD:-}"
      MAX_FILESIZE_MB: "${MAX_FILESIZE_MB:-500}"
      COOKIES_PATH: "/data/cookies.txt"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
