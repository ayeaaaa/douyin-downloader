name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-exe:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.2"

      - name: Prepare signer (deps + SDK files)
        shell: bash
        working-directory: signer
        run: |
          npm install --omit=dev --no-audit --no-fund
          node fetch-sdk.js

      - name: Bundle Node runtime (must match signer.jsc V8 version)
        shell: bash
        run: |
          curl -fsSL -o node.zip https://nodejs.org/dist/v20.19.2/node-v20.19.2-win-x64.zip
          mkdir -p node
          unzip -j node.zip "node-v20.19.2-win-x64/node.exe" -d node
          ls -la node

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: pyinstaller desktop/douyin-downloader.spec --noconfirm

      - name: Package
        shell: bash
        run: |
          mkdir -p package
          cp dist/douyin-downloader.exe package/
          cat > package/README.txt <<'EOF'
          抖音下载站 · Windows 本地版
          ============================
          1. 双击 douyin-downloader.exe 启动
          2. 浏览器自动打开 http://127.0.0.1:8899/
          3. 保持命令行窗口打开；关闭即退出

          Cookie（可选但推荐）：
          用浏览器插件导出 douyin.com 的 cookies.txt，
          放入 exe 同目录的 data/ 文件夹（首次运行后生成）。
          需要包含 UIFID_TEMP 才能通过风控签名校验。
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: douyin-downloader-windows
          path: package/*

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "no keystore secret; building unsigned release"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Package
        run: |
          mkdir -p package
          cp android/app/build/outputs/apk/release/*.apk package/douyin-downloader.apk
          ls -la package

      - uses: actions/upload-artifact@v4
        with:
          name: douyin-downloader-apk
          path: package/*

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-exe, android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
